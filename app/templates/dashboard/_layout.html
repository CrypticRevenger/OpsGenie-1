<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}OpsGenie Dashboard{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
<!-- Background glowing spots for dashboard -->
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; pointer-events: none; z-index: 0;">
  <div style="position: absolute; top: -100px; left: -100px; width: 400px; height: 400px; background: radial-gradient(circle, rgba(16, 185, 129, 0.04) 0%, rgba(0, 0, 0, 0) 70%); border-radius: 50%; filter: blur(50px);"></div>
  <div style="position: absolute; bottom: -100px; right: -100px; width: 400px; height: 400px; background: radial-gradient(circle, rgba(52, 211, 153, 0.03) 0%, rgba(0, 0, 0, 0) 70%); border-radius: 50%; filter: blur(50px);"></div>
</div>

{% block topbar %}
<div class="topbar">
  <a class="brand" href="/dashboard/companies">OpsGenie Admin</a>
  <form method="post" action="/dashboard/logout">
    <button type="submit">Log out</button>
  </form>
</div>
{% endblock %}
<div class="wrap" style="position: relative; z-index: 2;">
{% if error %}
<div class="error-banner">{{ error }}</div>
{% endif %}
{% block content %}{% endblock %}
</div>
<script src="/static/js/dashboard.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
