name: Keep Render backend warm

on:
  schedule:
    # Every 10 minutes — comfortably inside Render's 15-minute idle timeout.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 90 https://opsgenie.onrender.com/health
      # Forces the 8am-briefing/notification dispatch to actually run on
      # schedule. APScheduler's own interval job (app/core/scheduler.py)
      # only ticks while the web process happens to already be awake — on
      # Render's free tier that's not guaranteed at any given wall-clock
      # minute, so without this, dispatch only "catches up" whenever some
      # other traffic (e.g. a distributor's WhatsApp message) wakes the
      # process. Same cadence as the /health ping above.
      - name: Trigger scheduled dispatch tick
        env:
          # Passed through the environment rather than interpolated into the
          # script body: `${{ secrets.* }}` splices its value into the shell
          # command GitHub assembles, so the key's contents get parsed as shell
          # rather than staying an opaque string.
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        # --max-time 300: a tick that needs to actually generate a briefing
        # walks LLM_FALLBACKS (app/services/llm/factory.py::generate_with_fallback)
        # trying each configured provider in order, up to llm_timeout_seconds
        # (30s) apiece before moving on — with 6 providers configured
        # (LLM_PROVIDER + LLM_FALLBACKS in .env) that's up to 180s for one
        # company's briefing alone if several providers are slow rather than
        # failing fast, before WhatsApp sends or a second concern (e.g. the
        # evening brief, also LLM-backed) even runs. The endpoint itself
        # already tolerates this (idempotent, safe to call as often as
        # needed — see app/api/admin/scheduler.py) — this was only ever the
        # monitor giving up client-side, not the dispatch failing server-side.
        run: |
          # A secret that was never created expands to an empty string instead
          # of failing the workflow, so without this guard the step still sends
          # the request — just an unauthenticated one — and require_api_key
          # (app/core/auth.py) answers 401 exactly as designed. curl surfaces
          # that as a bare "error: 401", which reads as a wrong key or a broken
          # server when the real cause is that no key was ever configured here.
          # Say so directly instead; the tick is unrunnable either way.
          if [ -z "$ADMIN_API_KEY" ]; then
            echo "::error::ADMIN_API_KEY repository secret is not set. Add it under" \
                 "Settings > Secrets and variables > Actions, matching the" \
                 "ADMIN_API_KEY env var on the Render service."
            exit 1
          fi
          curl -fsS --max-time 300 -X POST https://opsgenie.onrender.com/admin/scheduler/tick \
            -H "X-API-Key: $ADMIN_API_KEY"
