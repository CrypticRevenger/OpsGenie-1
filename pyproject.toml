[project]
name = "opsgenie"
version = "0.0.0"
description = "WhatsApp-first daily financial operating assistant for B2B distributors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.0",
    "anthropic>=0.40.0",
    "apscheduler>=3.10.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "google-genai>=0.3.0",
    "openai>=1.50.0",
    "openpyxl>=3.1.5",
    "phonenumbers>=9.0.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.17",
    "sqlalchemy[asyncio]>=2.0.36",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pdfplumber>=0.11.10",
    "pre-commit>=4.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]
"app/api/onboarding_page.py" = ["E501"]  # HTML/CSS/JS template blob — line length n/a
"alembic/versions/*.py" = ["E501"]  # generated migration files — line length not enforced
"app/models/__init__.py" = ["F401"]  # re-export module — all imports are intentional

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
